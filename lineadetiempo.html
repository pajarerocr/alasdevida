<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Curva de Pajareo</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:black;
color:white;
font-family:"Manrope",sans-serif;
}

.wrapper{
position:relative;
width:100%;
height:700px;
}

/* MAPA */

.map{
position:absolute;
width:100%;
height:100%;
opacity:.18;
display:flex;
justify-content:center;
align-items:center;
}

.map svg{
height:90%;
}

/* CANVAS */

canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

/* PANEL */

.panel{
position:absolute;
right:40px;
top:60px;
width:320px;
background:rgba(0,0,0,.9);
border:1px solid rgba(255,255,255,.1);
padding:20px;
opacity:0;
transition:opacity .25s;
}

.title{
font-size:22px;
margin-bottom:6px;
}

.meta{
font-size:14px;
opacity:.6;
margin-bottom:10px;
}

.desc{
font-size:14px;
line-height:1.4;
}

</style>

</head>

<body>

<div class="wrapper">

<div class="map">

<svg viewBox="0 0 300 500">

<path d="M90 20 L150 10 L230 70 L260 170 L240 290 L180 420 L110 380 L70 290 L60 170 Z"
fill="none"
stroke="#444"
stroke-width="2"/>

</svg>

</div>

<canvas id="curve"></canvas>

<div id="panel" class="panel">

<div class="title">Roseate Spoonbill</div>

<div class="meta">
13 jun 2024 · Corcovado
</div>

<div class="desc">
Uno de los primeros grandes asombros tropicales del camino.
</div>

</div>

</div>

<script>

const canvas = document.getElementById("curve")
const ctx = canvas.getContext("2d")

function resize(){

canvas.width = canvas.offsetWidth
canvas.height = canvas.offsetHeight

draw()

}

window.addEventListener("resize",resize)

resize()

const points = [
[50,620],
[120,600],
[200,560],
[300,470],
[380,410],
[460,350],
[520,330]
]

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.beginPath()

ctx.lineWidth = 3
ctx.strokeStyle = "white"
ctx.lineCap="round"
ctx.lineJoin="round"

ctx.moveTo(points[0][0],points[0][1])

for(let i=1;i<points.length;i++){

ctx.lineTo(points[i][0],points[i][1])

}

ctx.stroke()

points.forEach(p=>{

ctx.beginPath()
ctx.arc(p[0],p[1],5,0,Math.PI*2)
ctx.fillStyle="white"
ctx.fill()

})

}

canvas.addEventListener("mousemove",(e)=>{

const rect = canvas.getBoundingClientRect()

const x = e.clientX - rect.left
const y = e.clientY - rect.top

let active=false

points.forEach(p=>{

const dx = x-p[0]
const dy = y-p[1]

if(Math.sqrt(dx*dx+dy*dy)<10){

document.getElementById("panel").style.opacity=1
active=true

}

})

if(!active){

document.getElementById("panel").style.opacity=0

}

})

</script>

</body>
</html>
